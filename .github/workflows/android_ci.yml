name: Build & upload to Firebase App Distribution

on:
  push:
    branches-ignore:
      - master

# Keep only the newest build for each branch. A new push cancels an older
# in-progress or queued run before it can upload an outdated APK.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Reuse Gradle's downloaded dependencies between workflow runs and jobs.
      # This avoids repeatedly resolving the whole dependency graph from Maven Central.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (Regression Tests)
        run: ./gradlew test

  build:
    needs: test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create key.properties and Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/keystore
          cat <<EOF > key.properties
          storeFile=../keystore/keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Generate Release APK
        run: |
          # Maven Central occasionally rate-limits shared GitHub-hosted runner IPs.
          # Retry transient dependency-download failures with increasing backoff.
          for attempt in 1 2 3; do
            ./gradlew --no-daemon assembleRelease && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

      - name: upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{secrets.FIREBASE_ANDROID_APP_ID}}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          releaseNotes: "App Build"
          file: presentation/build/outputs/apk/release/presentation-release.apk
