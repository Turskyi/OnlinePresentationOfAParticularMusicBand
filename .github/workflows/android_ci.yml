name: Build & upload to Firebase App Distribution

on:
  push:
    branches-ignore:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2.3.3

      - name: Set up JDK environment(JDK 17)
        uses: actions/setup-java@v1.4.3
        with:
          java-version: 17

      - name: Run Unit Tests (Regression Tests)
        run: ./gradlew test

  build:
    needs: test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2.3.3

      - name: Set up JDK environment(JDK 17)
        uses: actions/setup-java@v1.4.3
        with:
          java-version: 17

      - name: Create key.properties and Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/keystore
          cat <<EOF > key.properties
          storeFile=../keystore/keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Generate Release APK
        run: ./gradlew assembleRelease

      - name: upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{secrets.FIREBASE_ANDROID_APP_ID}}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          releaseNotes: "App Build"
          file: presentation/build/outputs/apk/release/presentation-release.apk
